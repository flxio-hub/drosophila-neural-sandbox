# Configurazione di Streamlit per la Drosophila Neural Sandbox.

[server]
# MB: i CSV del connettoma (FlyWire Codex) possono superare i 200 MB di default.
# Per file oltre ~1 GB conviene "Importa da percorso" nella pagina Dati (il browser tiene il file in RAM).
maxUploadSize = 2048

[theme]
font = "sans-serif"
baseRadius = "medium"
showSidebarBorder = true
# Titoli più contenuti dei valori predefiniti (2.75 / 2.25 / 1.75 / 1.5 rem): i grafici stanno in colonne strette.
headingFontSizes = ["2.1rem", "1.6rem", "1.3rem", "1.1rem"]
headingFontWeights = [700, 650, 650, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 600

# Colori ricavati dalla palette validata di sandbox/viz/theme.py (tema chiaro e scuro).
[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
linkColor = "#2a78d6"
blueColor = "#2a78d6"
redColor = "#e34948"
greenColor = "#1baf7a"
orangeColor = "#eb6834"
yellowColor = "#eda100"
violetColor = "#4a3aa7"
grayColor = "#898781"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#121211"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
borderColor = "#383835"
linkColor = "#6da7ec"
blueColor = "#3987e5"
redColor = "#e66767"
greenColor = "#199e70"
orangeColor = "#d95926"
yellowColor = "#c98500"
violetColor = "#9085e9"
grayColor = "#898781"
